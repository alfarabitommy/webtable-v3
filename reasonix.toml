[[providers]]
name        = "deepseek-flash"
kind        = "anthropic"
base_url    = "https://api.deepseek.com/anthropic"
models      = ["deepseek-v4-flash", "deepseek-v4-flash-vision-exp"]
default     = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.014, input = 0.44, output = 1.32, currency = "$" }
prices      = { "deepseek-v4-flash-vision-exp" = { cache_hit = 0.014, input = 0.44, output = 1.32, currency = "$" } }
billing_currency = "USD"
thinking    = "enabled"
vision_models = ["deepseek-v4-flash-vision-exp"]
web_search  = true
supported_efforts = ["disabled", "low", "high", "max"]
default_effort    = "high"

[[providers]]
name        = "deepseek-pro"
kind        = "anthropic"
base_url    = "https://api.deepseek.com/anthropic"
model       = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price       = { cache_hit = 0.044, input = 1.32, output = 3.96, currency = "$" }
billing_currency = "USD"
thinking    = "enabled"
web_search  = true
supported_efforts = ["disabled", "low", "high", "max"]
default_effort    = "high"

